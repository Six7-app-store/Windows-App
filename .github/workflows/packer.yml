# GitHub Actions Workflow: Packer checks
# Prueft die Packer-Vorlage bei jedem Push, Pull Request und Release:
# - packer init      -> laedt die benoetigten Plugins
# - packer fmt       -> prueft die Formatierung
# - packer validate  -> prueft die Vorlage inhaltlich
#
# Gebaut wird hier nicht. Ein Windows-Build dauert 25 bis 40 Minuten und
# braucht Zugang zur OpenStack-API der DHBW, die von einem gehosteten
# GitHub-Runner nicht erreichbar ist. Den Build stoesst der Worker an.

name: 'Packer'

on:
  push:
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  packer:
    name: 'Packer'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup `packer` (local action)
      uses: ./.github/actions
      id: setup_packer
      with:
        version: '1.14.3'

    - name: Print `packer` version
      run: packer version

    - name: Packer Init
      run: packer init packer

    - name: Packer Format
      run: packer fmt -check packer

    # -syntax-only ist hier keine Bequemlichkeit, sondern noetig: ein volles
    # `packer validate` baut den Builder auf und meldet sich dabei bei
    # Keystone an. Die OpenStack-API der DHBW ist von einem gehosteten
    # GitHub-Runner aus nicht erreichbar, der Schritt liefe also immer in
    # einen Timeout - nachgestellt am 19.09.2026, der Fehler lautet
    # "dial tcp 141.72.5.140:5000: connection attempt failed".
    #
    # Geprueft wird damit trotzdem das Wesentliche: HCL-Syntax, aufloesbare
    # Variablen, vorhandene templatefile()-Vorlagen und richtige Pfade zu
    # den Skripten.
    - name: Packer Validate (Syntax)
      run: packer validate -syntax-only packer

    # Die Vorlage laedt drei PowerShell-Dateien nach. Fehlt eine davon,
    # faellt das sonst erst 30 Minuten in den Build hinein auf.
    - name: Skripte vorhanden?
      run: |
        set -euo pipefail
        fehlt=0
        for datei in \
          packer/scripts/bootstrap.ps1.tpl \
          packer/scripts/provision.ps1 \
          packer/scripts/cleanup.ps1
        do
          if [ ! -f "$datei" ]; then
            echo "::error::$datei fehlt"
            fehlt=1
          else
            echo "ok: $datei"
          fi
        done
        exit $fehlt

    # Die beiden Vorlagen erst mit Beispielwerten rendern - PowerShell soll
    # den Text sehen, den die VM spaeter bekommt, nicht die Platzhalter.
    - name: PowerShell-Vorlagen rendern
      run: |
        set -euo pipefail
        mkdir -p /tmp/ps
        python3 - <<'PY'
        import io
        werte = {
            'terraform/windows-multi-user.ps1.tpl': {
                'username': 'alicesmith', 'password': 'Tq7!xR-2mVp9wZ=k',
                'team': 'team-alpha', 'email': 'alice.smith@dhbw.de'},
            'packer/scripts/bootstrap.ps1.tpl': {
                'build_password': 'Bld!abc123def456Aa1'},
        }
        for pfad, vars in werte.items():
            s = io.open(pfad, encoding='utf-8').read()
            for k, v in vars.items():
                s = s.replace('${%s}' % k, v)
            s = s.replace('$${', '${').replace('%%{', '%{')
            ziel = '/tmp/ps/' + pfad.split('/')[-1].replace('.tpl', '')
            io.open(ziel, 'w', encoding='utf-8').write(s)
            print('gerendert:', ziel)
        PY
        cp packer/scripts/provision.ps1 packer/scripts/cleanup.ps1 /tmp/ps/

    # Ein Syntaxfehler in einem dieser Skripte faellt sonst erst auf der
    # laufenden VM auf - nach Image-Download, Boot und WinRM-Verbindung,
    # also eine knappe halbe Stunde in den Build hinein.
    - name: PowerShell-Syntax pruefen
      shell: pwsh
      run: |
        $fehler = 0
        foreach ($datei in (Get-ChildItem /tmp/ps -Filter *.ps1)) {
            $tokens = $null; $parseFehler = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
                $datei.FullName, [ref]$tokens, [ref]$parseFehler) | Out-Null
            if ($parseFehler.Count -gt 0) {
                Write-Output "::error::$($datei.Name): $($parseFehler.Count) Syntaxfehler"
                $parseFehler | Select-Object -First 5 | ForEach-Object {
                    Write-Output "  Zeile $($_.Extent.StartLineNumber): $($_.Message)"
                }
                $fehler++
            } else {
                Write-Output "$($datei.Name): Syntax OK"
            }
        }
        if ($fehler -gt 0) { exit 1 }
